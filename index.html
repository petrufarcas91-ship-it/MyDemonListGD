<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MyDemonList</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        gd: {
                            dark: '#000000',
                            card: '#080808',
                            border: '#1f1f1f',
                            accent: '#ffffff'
                        }
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif']
                    }
                }
            }
        }
    </script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            background-color: #030303;
            color: #e5e5e5;
            font-family: 'Inter', sans-serif;
            background-image: 
                radial-gradient(circle at 50% 0%, rgba(255, 255, 255, 0.05) 0%, transparent 60%),
                radial-gradient(circle at 80% 80%, rgba(255, 255, 255, 0.02) 0%, transparent 50%);
            background-attachment: fixed;
        }

        /* Glassmorphism & UI Accents */
        .glass-panel {
            background: rgba(10, 10, 10, 0.75);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        .glass-panel-hover {
            transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .glass-panel-hover:hover {
            border-color: rgba(255, 255, 255, 0.25);
            transform: translateY(-2px);
            box-shadow: 0 12px 30px -10px rgba(0, 0, 0, 0.8), 0 0 20px rgba(255, 255, 255, 0.03);
        }

        .grid-bg {
            background-size: 32px 32px;
            background-image: 
                linear-gradient(to right, rgba(255, 255, 255, 0.02) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(255, 255, 255, 0.02) 1px, transparent 1px);
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #030303;
        }
        ::-webkit-scrollbar-thumb {
            background: #222;
            border-radius: 3px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #444;
        }

        /* Text Gradients & Subtle Effects */
        .text-glow {
            text-shadow: 0 0 20px rgba(255, 255, 255, 0.3);
        }

        /* Animated Modal Backdrop */
        .modal-enter {
            animation: modalIn 0.2s ease-out forwards;
        }
        @keyframes modalIn {
            from { opacity: 0; transform: scale(0.96) translateY(8px); }
            to { opacity: 1; transform: scale(1) translateY(0); }
        }
    </style>
</head>
<body class="min-h-screen flex flex-col selection:bg-white selection:text-black grid-bg">

    <div id="app" class="flex-1 flex flex-col">
        <!-- Sleek Navbar -->
        <header class="border-b border-neutral-900/80 bg-black/80 backdrop-blur-md sticky top-0 z-50">
            <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
                <div class="flex items-center space-x-3 cursor-pointer group" onclick="router.navigate('home')">
                    <div class="w-9 h-9 rounded-xl bg-gradient-to-br from-white to-neutral-400 flex items-center justify-center text-black font-black shadow-lg shadow-white/5 transition group-hover:scale-105">
                        <i class="fa-solid fa-list-check text-black text-sm"></i>
                    </div>
                    <span class="text-lg font-black tracking-wider text-white uppercase transition group-hover:opacity-90">
                        My<span class="text-neutral-400 font-light">Demon</span>List
                    </span>
                </div>

                <div class="flex items-center space-x-3">
                    <button onclick="router.navigate('home')" class="px-3.5 py-1.5 rounded-lg text-xs font-semibold uppercase tracking-wider text-neutral-400 hover:text-white hover:bg-neutral-900/60 transition">
                        <i class="fa-solid fa-compass mr-1.5 opacity-60"></i> Explore
                    </button>
                    <div id="auth-nav-container" class="flex items-center space-x-3">
                        <!-- Dynamic Auth Buttons -->
                    </div>
                </div>
            </div>
        </header>

        <!-- Main Content Area -->
        <main id="router-view" class="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-8">
            <!-- Dynamic Route Views Render Here -->
        </main>

        <!-- Global Modal Window -->
        <div id="modal-container" class="fixed inset-0 bg-black/80 backdrop-blur-md z-50 flex items-center justify-center p-4 hidden">
            <div id="modal-content" class="bg-neutral-950 border border-neutral-800 rounded-2xl w-full max-w-md p-6 relative shadow-2xl modal-enter">
                <!-- Dynamic Modal Content -->
            </div>
        </div>

        <!-- Notification Toast -->
        <div id="toast" class="fixed bottom-6 right-6 z-50 transform translate-y-20 opacity-0 transition-all duration-300 pointer-events-none">
            <div id="toast-body" class="bg-neutral-900 border border-neutral-700 text-white px-5 py-3 rounded-xl shadow-2xl flex items-center space-x-3">
                <i id="toast-icon" class="fa-solid fa-circle-check text-white text-base"></i>
                <span id="toast-message" class="text-xs font-semibold tracking-wide">Notification</span>
            </div>
        </div>

        <script type="module">
            // Simple Client-Side Router Definition
            class Router {
                constructor() {
                    this.routes = {};
                    window.addEventListener('hashchange', () => this.handleRoute());
                }

                addRoute(path, handler) {
                    this.routes[path] = handler;
                }

                navigate(path, params = {}) {
                    let queryString = new URLSearchParams(params).toString();
                    window.location.hash = queryString ? `${path}?${queryString}` : path;
                }

                handleRoute() {
                    const fullHash = window.location.hash.slice(1) || 'home';
                    const [path, queryString] = fullHash.split('?');
                    const params = {};
                    if (queryString) {
                        new URLSearchParams(queryString).forEach((val, key) => params[key] = val);
                    }

                    if (this.routes[path]) {
                        this.routes[path](params);
                    } else if (this.routes['home']) {
                        this.routes['home'](params);
                    }
                }
            }

            // Expose router to global scope
            window.router = new Router();

            // Global State Management
            window.currentUser = null;
            window.userProfile = null;

            // Global Helper: Escape HTML
            window.escapeHtml = function(str) {
                if (!str) return '';
                return String(str)
                    .replace(/&/g, '&amp;')
                    .replace(/</g, '&lt;')
                    .replace(/>/g, '&gt;')
                    .replace(/"/g, '&quot;')
                    .replace(/'/g, '&#039;');
            };

            // Global Helper: Show Toast Notifications
            window.showToast = function(message, type = 'success') {
                const toast = document.getElementById('toast');
                const toastMessage = document.getElementById('toast-message');
                const toastIcon = document.getElementById('toast-icon');

                toastMessage.textContent = message;
                if (type === 'error') {
                    toastIcon.className = 'fa-solid fa-triangle-exclamation text-red-500 text-base';
                } else {
                    toastIcon.className = 'fa-solid fa-circle-check text-emerald-400 text-base';
                }

                toast.classList.remove('translate-y-20', 'opacity-0');
                toast.classList.add('translate-y-0', 'opacity-100');

                setTimeout(() => {
                    toast.classList.remove('translate-y-0', 'opacity-100');
                    toast.classList.add('translate-y-20', 'opacity-0');
                }, 3000);
            };

            // Global Helper: Modal Dialog Controls
            window.openModal = function(htmlContent) {
                const modalContainer = document.getElementById('modal-container');
                const modalContent = document.getElementById('modal-content');
                modalContent.innerHTML = htmlContent;
                modalContainer.classList.remove('hidden');
            };

            window.closeModal = function() {
                const modalContainer = document.getElementById('modal-container');
                modalContainer.classList.add('hidden');
            };

            // Helper function to derive secure PBKDF2 password hashes with salt
            async function hashPassword(password, saltHex = null) {
                const encoder = new TextEncoder();
                let salt;
                if (saltHex) {
                    salt = new Uint8Array(saltHex.match(/.{1,2}/g).map(byte => parseInt(byte, 16)));
                } else {
                    salt = window.crypto.getRandomValues(new Uint8Array(16));
                }
                
                const keyMaterial = await window.crypto.subtle.importKey(
                    "raw",
                    encoder.encode(password),
                    "PBKDF2",
                    false,
                    ["deriveBits"]
                );

                const derivedBits = await window.crypto.subtle.deriveBits(
                    {
                        name: "PBKDF2",
                        salt: salt,
                        iterations: 100000,
                        hash: "SHA-256"
                    },
                    keyMaterial,
                    256
                );

                const hashArray = Array.from(new Uint8Array(derivedBits));
                const hashHex = hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
                const actualSaltHex = Array.from(salt).map(b => b.toString(16).padStart(2, '0')).join('');

                return { hash: hashHex, salt: actualSaltHex };
            }

            // LocalStorage persistence for Users, Lists, and Follows
            window.allUsers = JSON.parse(localStorage.getItem('mydemonlist_users_v2')) || [];
            window.allLists = JSON.parse(localStorage.getItem('mydemonlist_lists_v2')) || [];
            window.allFollows = JSON.parse(localStorage.getItem('mydemonlist_follows_v1')) || [];

            function saveListsToStorage() {
                localStorage.setItem('mydemonlist_lists_v2', JSON.stringify(window.allLists));
            }

            function saveUsersToStorage() {
                localStorage.setItem('mydemonlist_users_v2', JSON.stringify(window.allUsers));
            }

            function saveFollowsToStorage() {
                localStorage.setItem('mydemonlist_follows_v1', JSON.stringify(window.allFollows));
            }

            // Theme definitions system
            window.THEMES = {
                monochrome: {
                    name: 'Monochrome',
                    badge: 'bg-neutral-800 text-neutral-300 border border-neutral-700',
                    border: 'border-neutral-800',
                    bg: 'bg-neutral-950/80',
                    accentText: 'text-white',
                    accentBg: 'bg-white text-black hover:bg-neutral-200',
                    glow: 'shadow-white/5'
                },
                crimson: {
                    name: 'Neon Crimson',
                    badge: 'bg-red-950/80 text-red-400 border border-red-800/60',
                    border: 'border-red-900/50',
                    bg: 'bg-red-950/20',
                    accentText: 'text-red-400',
                    accentBg: 'bg-red-600 text-white hover:bg-red-500',
                    glow: 'shadow-red-600/20'
                },
                emerald: {
                    name: 'Emerald Matrix',
                    badge: 'bg-emerald-950/80 text-emerald-400 border border-emerald-800/60',
                    border: 'border-emerald-900/50',
                    bg: 'bg-emerald-950/20',
                    accentText: 'text-emerald-400',
                    accentBg: 'bg-emerald-600 text-white hover:bg-emerald-500',
                    glow: 'shadow-emerald-600/20'
                },
                violet: {
                    name: 'Cyber Violet',
                    badge: 'bg-purple-950/80 text-purple-400 border border-purple-800/60',
                    border: 'border-purple-900/50',
                    bg: 'bg-purple-950/20',
                    accentText: 'text-purple-400',
                    accentBg: 'bg-purple-600 text-white hover:bg-purple-500',
                    glow: 'shadow-purple-600/20'
                },
                gold: {
                    name: 'Gold Trophy',
                    badge: 'bg-amber-950/80 text-amber-400 border border-amber-800/60',
                    border: 'border-amber-900/50',
                    bg: 'bg-amber-950/20',
                    accentText: 'text-amber-400',
                    accentBg: 'bg-amber-500 text-black font-black hover:bg-amber-400',
                    glow: 'shadow-amber-500/20'
                },
                light: {
                    name: 'Pure Light',
                    badge: 'bg-neutral-200 text-neutral-900 border border-neutral-300 font-bold',
                    border: 'border-neutral-700',
                    bg: 'bg-neutral-900',
                    accentText: 'text-neutral-100',
                    accentBg: 'bg-neutral-100 text-black hover:bg-white',
                    glow: 'shadow-white/10'
                }
            };

            window.getTheme = function(themeKey) {
                return window.THEMES[themeKey] || window.THEMES.monochrome;
            };

            // Avatar helper HTML renderer
            window.getAvatarHtml = function(user, sizeClass = "w-8 h-8", textClass = "text-xs") {
                const initial = (user && user.username) ? user.username.charAt(0).toUpperCase() : '?';
                if (user && user.avatarUrl && user.avatarUrl.trim()) {
                    return `
                        <div class="${sizeClass} rounded-xl overflow-hidden bg-neutral-900 border border-neutral-800 flex-shrink-0">
                            <img src="${escapeHtml(user.avatarUrl.trim())}" alt="${escapeHtml(user.username)}" class="w-full h-full object-cover" onerror="this.outerHTML='<div class=\'w-full h-full bg-neutral-800 flex items-center justify-center ${textClass} font-black text-white uppercase\'>${initial}</div>'">
                        </div>
                    `;
                }
                return `
                    <div class="${sizeClass} rounded-xl bg-neutral-800 border border-neutral-700 flex items-center justify-center ${textClass} font-black text-white uppercase flex-shrink-0">
                        ${initial}
                    </div>
                `;
            };

            // Helper functions for follower social system
            window.isFollowing = function(followerId, targetUserId) {
                if (!followerId || !targetUserId) return false;
                return window.allFollows.some(f => f.followerId === followerId && f.followingId === targetUserId);
            };

            window.getFollowersCount = function(userId) {
                return window.allFollows.filter(f => f.followingId === userId).length;
            };

            window.getFollowingCount = function(userId) {
                return window.allFollows.filter(f => f.followerId === userId).length;
            };

            window.toggleFollowUser = function(targetUserId) {
                if (!window.currentUser || window.currentUser.isAnonymous || !window.userProfile) {
                    openLoginModal();
                    return;
                }

                if (window.userProfile.uid === targetUserId) {
                    showToast("You cannot follow yourself!", "error");
                    return;
                }

                const myUid = window.userProfile.uid;
                const existingIndex = window.allFollows.findIndex(f => f.followerId === myUid && f.followingId === targetUserId);

                const targetUser = window.allUsers.find(u => u.uid === targetUserId);
                const targetName = targetUser ? targetUser.username : 'creator';

                if (existingIndex !== -1) {
                    window.allFollows.splice(existingIndex, 1);
                    showToast(`Unfollowed ${targetName}`);
                } else {
                    window.allFollows.push({ followerId: myUid, followingId: targetUserId, timestamp: Date.now() });
                    showToast(`You are now following ${targetName}!`);
                }

                saveFollowsToStorage();

                const currentHash = window.location.hash.slice(1) || 'home';
                const [path, queryString] = currentHash.split('?');
                const params = {};
                if (queryString) {
                    new URLSearchParams(queryString).forEach((val, key) => params[key] = val);
                }
                if (window.router.routes[path]) {
                    window.router.routes[path](params);
                }
            };

            window.openFollowersModal = function(userId) {
                const user = window.allUsers.find(u => u.uid === userId);
                if (!user) return;

                const followers = window.allFollows
                    .filter(f => f.followingId === userId)
                    .map(f => window.allUsers.find(u => u.uid === f.followerId))
                    .filter(Boolean);

                openModal(`
                    <div class="flex items-center justify-between mb-4 pb-3 border-b border-neutral-800">
                        <div class="flex items-center space-x-2">
                            <i class="fa-solid fa-users text-xs text-neutral-400"></i>
                            <h3 class="text-sm font-bold text-white uppercase tracking-wider">${escapeHtml(user.username)}'s Followers (${followers.length})</h3>
                        </div>
                        <button onclick="closeModal()" class="text-neutral-500 hover:text-white transition"><i class="fa-solid fa-xmark text-sm"></i></button>
                    </div>
                    <div class="max-h-80 overflow-y-auto space-y-2 pr-1">
                        ${followers.length === 0 ? `
                            <p class="text-center text-xs text-neutral-500 py-6">No followers yet.</p>
                        ` : followers.map(u => `
                            <div onclick="router.navigate('profile', { uid: '${u.uid}' }); closeModal();" class="p-2.5 rounded-xl bg-neutral-900/60 hover:bg-neutral-800 border border-neutral-800 flex items-center justify-between cursor-pointer transition">
                                <div class="flex items-center space-x-3">
                                    ${getAvatarHtml(u, "w-8 h-8", "text-xs")}
                                    <span class="text-xs font-bold text-white">${escapeHtml(u.username)}</span>
                                </div>
                                <span class="text-[10px] text-neutral-400 font-semibold">View →</span>
                            </div>
                        `).join('')}
                    </div>
                `);
            };

            window.openFollowingModal = function(userId) {
                const user = window.allUsers.find(u => u.uid === userId);
                if (!user) return;

                const following = window.allFollows
                    .filter(f => f.followerId === userId)
                    .map(f => window.allUsers.find(u => u.uid === f.followingId))
                    .filter(Boolean);

                openModal(`
                    <div class="flex items-center justify-between mb-4 pb-3 border-b border-neutral-800">
                        <div class="flex items-center space-x-2">
                            <i class="fa-solid fa-user-plus text-xs text-neutral-400"></i>
                            <h3 class="text-sm font-bold text-white uppercase tracking-wider">${escapeHtml(user.username)} is Following (${following.length})</h3>
                        </div>
                        <button onclick="closeModal()" class="text-neutral-500 hover:text-white transition"><i class="fa-solid fa-xmark text-sm"></i></button>
                    </div>
                    <div class="max-h-80 overflow-y-auto space-y-2 pr-1">
                        ${following.length === 0 ? `
                            <p class="text-center text-xs text-neutral-500 py-6">Not following anyone yet.</p>
                        ` : following.map(u => `
                            <div onclick="router.navigate('profile', { uid: '${u.uid}' }); closeModal();" class="p-2.5 rounded-xl bg-neutral-900/60 hover:bg-neutral-800 border border-neutral-800 flex items-center justify-between cursor-pointer transition">
                                <div class="flex items-center space-x-3">
                                    ${getAvatarHtml(u, "w-8 h-8", "text-xs")}
                                    <span class="text-xs font-bold text-white">${escapeHtml(u.username)}</span>
                                </div>
                                <span class="text-[10px] text-neutral-400 font-semibold">View →</span>
                            </div>
                        `).join('')}
                    </div>
                `);
            };

            window.updateAuthNav = function() {
                const navContainer = document.getElementById('auth-nav-container');
                if (currentUser && !currentUser.isAnonymous && userProfile) {
                    navContainer.innerHTML = `
                        <button onclick="router.navigate('dashboard')" class="px-3 py-1.5 rounded-xl bg-neutral-900 border border-neutral-800 hover:border-neutral-700 text-white text-xs font-semibold flex items-center space-x-2 transition">
                            ${getAvatarHtml(userProfile, "w-5 h-5", "text-[10px]")}
                            <span class="hidden sm:inline">${escapeHtml(userProfile.username)}</span>
                        </button>
                        <button onclick="handleLogout()" class="p-2 rounded-xl text-neutral-400 hover:text-white hover:bg-neutral-900 transition" title="Log Out">
                            <i class="fa-solid fa-right-from-bracket text-xs"></i>
                        </button>
                    `;
                } else {
                    navContainer.innerHTML = `
                        <button onclick="openLoginModal()" class="px-3.5 py-1.5 rounded-xl text-xs font-semibold text-neutral-300 hover:text-white hover:bg-neutral-900 transition">
                            Log In
                        </button>
                        <button onclick="openRegisterModal()" class="px-3.5 py-1.5 rounded-xl text-xs font-bold bg-white text-black hover:bg-neutral-200 transition shadow-lg shadow-white/5">
                            Sign Up
                        </button>
                    `;
                }
            };

            window.openLoginModal = function() {
                openModal(`
                    <div class="flex items-center justify-between mb-6">
                        <div class="flex items-center space-x-2.5">
                            <div class="w-8 h-8 rounded-lg bg-neutral-900 border border-neutral-800 flex items-center justify-center text-white">
                                <i class="fa-solid fa-right-to-bracket text-xs"></i>
                            </div>
                            <h3 class="text-base font-bold text-white uppercase tracking-wider">Log In</h3>
                        </div>
                        <button onclick="closeModal()" class="text-neutral-500 hover:text-white transition"><i class="fa-solid fa-xmark text-sm"></i></button>
                    </div>
                    <form onsubmit="handleLoginSubmit(event)" class="space-y-4">
                        <div>
                            <label class="block text-[10px] font-bold uppercase tracking-widest text-neutral-400 mb-1.5">Username</label>
                            <input type="text" id="login-username" required class="w-full bg-black border border-neutral-800 rounded-xl px-3.5 py-2.5 text-white focus:outline-none focus:border-white transition text-xs" placeholder="e.g. SpaceUK">
                        </div>
                        <div>
                            <label class="block text-[10px] font-bold uppercase tracking-widest text-neutral-400 mb-1.5">Password</label>
                            <input type="password" id="login-password" required class="w-full bg-black border border-neutral-800 rounded-xl px-3.5 py-2.5 text-white focus:outline-none focus:border-white transition text-xs" placeholder="••••••••">
                        </div>
                        <button type="submit" id="login-btn" class="w-full py-2.5 bg-white text-black font-bold rounded-xl hover:bg-neutral-200 transition text-xs uppercase tracking-wider flex items-center justify-center space-x-2">
                            <span>Log In</span>
                        </button>
                    </form>
                `);
            };

            window.openRegisterModal = function() {
                openModal(`
                    <div class="flex items-center justify-between mb-6">
                        <div class="flex items-center space-x-2.5">
                            <div class="w-8 h-8 rounded-lg bg-neutral-900 border border-neutral-800 flex items-center justify-center text-white">
                                <i class="fa-solid fa-user-plus text-xs"></i>
                            </div>
                            <h3 class="text-base font-bold text-white uppercase tracking-wider">Create Account</h3>
                        </div>
                        <button onclick="closeModal()" class="text-neutral-500 hover:text-white transition"><i class="fa-solid fa-xmark text-sm"></i></button>
                    </div>
                    <form onsubmit="handleRegisterSubmit(event)" class="space-y-4">
                        <div>
                            <label class="block text-[10px] font-bold uppercase tracking-widest text-neutral-400 mb-1.5">Username</label>
                            <input type="text" id="register-username" required class="w-full bg-black border border-neutral-800 rounded-xl px-3.5 py-2.5 text-white focus:outline-none focus:border-white transition text-xs" placeholder="e.g. Zoink">
                        </div>
                        <div>
                            <label class="block text-[10px] font-bold uppercase tracking-widest text-neutral-400 mb-1.5">Avatar Image URL (Optional)</label>
                            <input type="url" id="register-avatar" class="w-full bg-black border border-neutral-800 rounded-xl px-3.5 py-2.5 text-white focus:outline-none focus:border-white transition text-xs" placeholder="https://example.com/avatar.png">
                        </div>
                        <div>
                            <label class="block text-[10px] font-bold uppercase tracking-widest text-neutral-400 mb-1.5">Password</label>
                            <input type="password" id="register-password" required minlength="4" class="w-full bg-black border border-neutral-800 rounded-xl px-3.5 py-2.5 text-white focus:outline-none focus:border-white transition text-xs" placeholder="••••••••">
                        </div>
                        <button type="submit" id="register-btn" class="w-full py-2.5 bg-white text-black font-bold rounded-xl hover:bg-neutral-200 transition text-xs uppercase tracking-wider flex items-center justify-center space-x-2">
                            <span>Create Account</span>
                        </button>
                    </form>
                `);
            };

            window.handleLoginSubmit = async function(e) {
                e.preventDefault();
                const btn = document.getElementById('login-btn');
                btn.disabled = true;
                btn.innerHTML = `<i class="fa-solid fa-spinner animate-spin"></i><span>Logging In...</span>`;

                const username = document.getElementById('login-username').value.trim();
                const password = document.getElementById('login-password').value;

                const existingUser = allUsers.find(u => u.username.toLowerCase() === username.toLowerCase());

                    showToast('Account not found. Please register first.', 'error');
                    btn.disabled = false;
                    btn.innerHTML = `<span>Log In</span>`;
                    return;
                }

                let isMatch = false;
                if (existingUser.passwordSalt && existingUser.passwordHash) {
                    const hashed = await hashPassword(password, existingUser.passwordSalt);
                    isMatch = (hashed.hash === existingUser.passwordHash);
                } else if (existingUser.password) {
                    isMatch = (existingUser.password === password);
                }

                if (!isMatch) {
                    showToast('Incorrect password.', 'error');
                    btn.disabled = false;
                    btn.innerHTML = `<span>Log In</span>`;
                    return;
                }

                currentUser = { uid: existingUser.uid, isAnonymous: false };
                userProfile = existingUser;

                updateAuthNav();
                closeModal();
                showToast(`Welcome back, ${userProfile.username}!`);
                router.navigate('dashboard');

                btn.innerHTML = `<i class="fa-solid fa-spinner animate-spin"></i><span>Creating Account...</span>`;

                const username = document.getElementById('register-username').value.trim();
                const avatarUrl = document.getElementById('register-avatar').value.trim();
                const password = document.getElementById('register-password').value;

                if (!username || username.length < 2) {
                    showToast('Username must be at least 2 characters long.', 'error');
                    btn.disabled = false;
                    btn.innerHTML = `<span>Create Account</span>`;
                    return;
                }

                const usernameExists = allUsers.some(u => u.username.toLowerCase() === username.toLowerCase());
                if (usernameExists) {
                    showToast('Username is already taken. Please choose another.', 'error');
                    btn.disabled = false;
                    btn.innerHTML = `<span>Create Account</span>`;
                    return;
                }

                const { hash, salt } = await hashPassword(password);
                const uid = 'usr_' + Date.now() + '_' + Math.random().toString(36).substring(2, 7);

                const newUser = {
                    uid: uid,
                    username: username,
                    avatarUrl: avatarUrl || '',

                    passwordSalt: salt,

                        <div>
                            <label class="block text-[10px] font-bold uppercase tracking-widest text-neutral-400 mb-1.5">YouTube Proof Link</label>
                            <input type="url" id="demon-video" value="${escapeHtml(demon.videoUrl || '')}" class="w-full bg-black border border-neutral-800 rounded-xl px-3.5 py-2.5 text-white focus:outline-none focus:border-white transition text-xs">
                        </div>
                        <button type="submit" class="w-full py-2.5 bg-white text-black font-bold rounded-xl hover:bg-neutral-200 transition text-xs uppercase tracking-wider">
                            Save Changes
                        </button>
                    </form>
                `);
            };

            window.handleSaveDemon = function(e, listId, demonId) {
                e.preventDefault();
                const list = allLists.find(l => l.id === listId);
                if (!list) return;

                const name = document.getElementById('demon-name').value.trim();
                const levelId = document.getElementById('demon-level-id').value.trim();
                const creator = document.getElementById('demon-creator').value.trim();
                const verifier = document.getElementById('demon-verifier').value.trim();
                const difficulty = document.getElementById('demon-difficulty').value;
                const videoUrl = document.getElementById('demon-video').value.trim();

                if (!list.demons) list.demons = [];

                if (demonId) {
                    const demonIndex = list.demons.findIndex(d => d.id === demonId);
                    if (demonIndex !== -1) {
                        list.demons[demonIndex] = { id: demonId, levelId, name, creator, verifier, difficulty, videoUrl };
                        showToast('Demon updated');
                    }
                } else {
                    const newDemon = { id: 'd-' + Date.now(), levelId, name, creator, verifier, difficulty, videoUrl };
                    list.demons.push(newDemon);
                    showToast('Demon added to list');
                }

                list.updatedAt = Date.now();
                saveListsToStorage();
                closeModal();
                renderEditorView({ listId });
            };

            window.moveDemon = function(listId, index, direction) {
                const list = allLists.find(l => l.id === listId);
                if (!list || !list.demons) return;
                const newIndex = index + direction;
                if (newIndex < 0 || newIndex >= list.demons.length) return;

                const temp = list.demons[index];
                list.demons[index] = list.demons[newIndex];
                list.demons[newIndex] = temp;

                list.updatedAt = Date.now();
                saveListsToStorage();
                renderEditorView({ listId });
            };

            window.deleteDemon = function(listId, demonId) {
                const list = allLists.find(l => l.id === listId);
                if (!list || !list.demons) return;
                list.demons = list.demons.filter(d => d.id !== demonId);
                list.updatedAt = Date.now();
                saveListsToStorage();
                showToast('Demon removed');
                renderEditorView({ listId });
            };

            router.addRoute('home', renderHomeView);
            router.addRoute('dashboard', renderDashboardView);
            router.addRoute('profile', renderProfileView);
            router.addRoute('list_detail', renderListDetailView);
            router.addRoute('editor', renderEditorView);

            // Initialize App
            updateAuthNav();
            router.handleRoute();
        </script>
    </div>
</body>
</html>
